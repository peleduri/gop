name: gop posture scan
description: >-
  Build gop's read-only evidence graph of a GitHub Enterprise (who can make code
  run where) and upload graph.json plus an HTML report as a workflow artifact.
  WARNING: artifacts are readable by anyone with read access to the repository
  running this Action. graph.json and the report are an attack map of your
  enterprise. Run this Action only in a PRIVATE repository.
author: peleduri
branding:
  icon: shield
  color: gray-dark

inputs:
  enterprise:
    description: Enterprise slug, for example "acme".
    required: true
  token:
    description: >-
      Read-only token gop collects with, used when app-id and app-private-key
      are not set. Prefer App mode (app-id and app-private-key) or a
      short-lived GitHub App installation token minted per run over a personal
      access token. A per-org App installation token cannot read enterprise
      settings: those facts, and any org the App is not installed in, are
      reported as not_visible, never as "off". Do not store an
      enterprise-owner PAT in Actions secrets: a long-lived enterprise-wide
      credential reachable from a workflow is exactly the high-value CI path gop
      reports. See README "Running in GitHub Actions: token risk".
    required: false
    default: ""
  app-id:
    description: >-
      GitHub App ID for App mode. With app-private-key set too, gop mints one
      read-only installation token per org the App is installed on, and the
      token input is ignored. Grant the App read-only permissions: repository
      Metadata, Contents, Administration and Actions, and organization Members
      and Administration. gop refuses an installation token granted anything
      but read.
    required: false
    default: ""
  app-private-key:
    description: >-
      The GitHub App private key (PEM contents) for App mode, from a secret,
      for example secrets.GOP_APP_PRIVATE_KEY. gop masks every line of it,
      holds it in memory and never prints or writes it. The key is a
      high-value credential: whoever holds it can mint tokens with every
      permission the App was granted. Keep it in a dedicated private repository
      with restricted workflow access.
    required: false
    default: ""
  output-dir:
    description: Directory for graph.json and report.html.
    required: false
    default: gop-out
  version:
    description: gop release to download, for example "v0.1.0", or "latest".
    required: false
    default: latest
  retention-days:
    description: >-
      Days to keep the uploaded artifact. Keep it short: the artifact is an
      attack map readable by anyone with read access to the repository.
      With fail-on-reach-increase on, a baseline older than this is gone by the
      next run, so set it to at least the schedule interval (see README).
    required: false
    default: "1"
  fail-on-reach-increase:
    description: >-
      "true" to compare this run's graph with the graph from the previous
      successful run of the same workflow on the default branch, and fail the
      job (after the artifact upload) when confirmed reach grew. The diff
      (diff.md and diff.json) goes only into the artifact; the log and step
      summary never name nodes. Needs "actions: read" in the workflow's
      permissions. With no previous artifact the gate logs "no baseline,
      skipping" and passes. With a baseline, report.html also opens with what
      changed since it. Off by default.
    required: false
    default: "false"
  baseline-artifact:
    description: >-
      Name of the artifact from the previous successful run to compare
      against. Used only with fail-on-reach-increase.
    required: false
    default: gop-posture
  cloud:
    description: >-
      "true" to send a small summary of this run (gop summary,
      gop.summary/v1: counts, coverage and the top findings as hash IDs, no
      names, tokens, logins or graph) to cloud-url, authenticated with a GitHub
      OIDC token (audience gop-cloud). Needs "id-token: write" in the
      workflow's permissions; without it the job fails before collecting.
      graph.json and the report never leave the artifact. The gop Cloud
      service is not live yet. See docs/cloud.md. Off by default.
    required: false
    default: "false"
  cloud-url:
    description: >-
      HTTPS endpoint the summary is POSTed to when cloud is "true". No
      default: nothing is sent anywhere unless you set it.
    required: false

runs:
  using: composite
  steps:
    - name: Check gop Cloud settings
      if: inputs.cloud == 'true'
      shell: bash
      env:
        GOP_CLOUD_URL: ${{ inputs.cloud-url }}
        GOP_CLOUD: ${{ github.action_path }}/cloud-upload.sh
      # Fails before collection when cloud-url is not https or the workflow
      # lacks "permissions: id-token: write".
      run: bash "${GOP_CLOUD}" check "${GOP_CLOUD_URL}"

    - name: Download and verify gop
      shell: bash
      env:
        GOP_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }} # only used to resolve and download the public release
        GOP_INSTALL: ${{ github.action_path }}/install-gop.sh
      # Run through bash, not the file's mode bit: on Windows (Git Bash) the
      # action path is a Windows path and checkouts may drop the exec bit.
      run: bash "${GOP_INSTALL}"

    - name: Collect and report
      shell: bash
      env:
        GOP_ENTERPRISE: ${{ inputs.enterprise }}
        GOP_OUT: ${{ inputs.output-dir }}
        GOP_INPUT_TOKEN: ${{ inputs.token }}
        GOP_INPUT_APP_ID: ${{ inputs.app-id }}
        GOP_INPUT_APP_KEY: ${{ inputs.app-private-key }}
      run: |
        set -euo pipefail
        # Mask every line of every credential before anything else runs. A
        # multi-line value must be masked line by line: ::add-mask:: takes one line.
        while IFS= read -r line; do
          line="${line%$'\r'}"
          if [ -n "${line}" ]; then echo "::add-mask::${line}"; fi
        done <<< "${GOP_INPUT_APP_KEY}"
        if [ -n "${GOP_INPUT_TOKEN}" ]; then echo "::add-mask::${GOP_INPUT_TOKEN}"; fi
        # Keep the credentials out of the environment of every other command:
        # each one is passed to gop collect alone.
        app_id="${GOP_INPUT_APP_ID}"
        app_key="${GOP_INPUT_APP_KEY}"
        token="${GOP_INPUT_TOKEN}"
        unset GOP_INPUT_APP_ID GOP_INPUT_APP_KEY GOP_INPUT_TOKEN
        mkdir -p "${GOP_OUT}"
        if [ -n "${app_id}" ] && [ -n "${app_key}" ]; then
          if [ -n "${token}" ]; then echo "gop action: app-id and app-private-key are set; using GitHub App mode, the token input is ignored"; fi
          GOP_APP_ID="${app_id}" GOP_APP_PRIVATE_KEY="${app_key}" \
            gop collect --enterprise "${GOP_ENTERPRISE}" --out "${GOP_OUT}/graph.json"
        elif [ -n "${app_id}" ] || [ -n "${app_key}" ]; then
          echo "gop action: App mode needs both app-id and app-private-key"; exit 1
        elif [ -n "${token}" ]; then
          GITHUB_TOKEN="${token}" \
            gop collect --enterprise "${GOP_ENTERPRISE}" --out "${GOP_OUT}/graph.json"
        else
          echo "gop action: set app-id and app-private-key (recommended), or token"; exit 1
        fi

    - name: Find baseline from the previous successful run
      id: baseline
      if: inputs.fail-on-reach-increase == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }} # needs actions: read to list runs and artifacts
        GOP_BASELINE_NAME: ${{ inputs.baseline-artifact }}
      run: |
        set -euo pipefail
        repo="${GITHUB_REPOSITORY}"
        if ! workflow_id="$(gh api "repos/${repo}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)"; then
          echo "gop action: cannot read this workflow run; fail-on-reach-increase needs 'actions: read' in the workflow permissions"
          exit 1
        fi
        # Strip any CR so the same parsing works in Git Bash on Windows.
        workflow_id="${workflow_id%$'\r'}"
        branch="$(gh api "repos/${repo}" --jq .default_branch)"
        branch="${branch%$'\r'}"
        run_id=""
        for id in $(gh api -X GET "repos/${repo}/actions/workflows/${workflow_id}/runs" \
            -f status=success -f branch="${branch}" -f per_page=30 --jq '.workflow_runs[].id' | tr -d '\r'); do
          if [ "${id}" = "${GITHUB_RUN_ID}" ]; then continue; fi
          n="$(gh api -X GET "repos/${repo}/actions/runs/${id}/artifacts" -f name="${GOP_BASELINE_NAME}" \
            --jq '[.artifacts[] | select(.expired | not)] | length')"
          n="${n%$'\r'}"
          if [ "${n}" -gt 0 ]; then run_id="${id}"; break; fi
        done
        if [ -z "${run_id}" ]; then
          echo "gop action: no baseline, skipping"
          echo "found=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        echo "gop action: baseline from run ${run_id}"
        { echo "found=true"; echo "run-id=${run_id}"; } >> "${GITHUB_OUTPUT}"

    - name: Download baseline
      if: steps.baseline.outputs.found == 'true'
      # An artifact that expires between the lookup and the download is a
      # missing baseline, not a failed scan: the next step skips the gate.
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.baseline-artifact }}
        run-id: ${{ steps.baseline.outputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/gop-baseline

    - name: Compare with baseline
      id: gate
      if: steps.baseline.outputs.found == 'true'
      shell: bash
      env:
        GOP_OUT: ${{ inputs.output-dir }}
        GOP_GATE: ${{ github.action_path }}/diff-gate.sh
      run: |
        set -uo pipefail
        if [ ! -f "${RUNNER_TEMP}/gop-baseline/graph.json" ]; then
          echo "gop action: no baseline, skipping"
          echo "result=skipped" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        result="$(bash "${GOP_GATE}" "${RUNNER_TEMP}/gop-baseline/graph.json" "${GOP_OUT}/graph.json" "${GOP_OUT}")"
        echo "result=${result}" >> "${GITHUB_OUTPUT}"
        case "${result}" in
          clean) echo "gop action: confirmed reach did not increase" ;;
          increase) echo "gop action: confirmed reach increased; see artifact (the job fails after the upload)" ;;
          *) echo "gop action: gop diff could not compare the graphs; see diff-stderr.txt in the artifact (the job fails after the upload)" ;;
        esac

    - name: Render report
      shell: bash
      env:
        GOP_OUT: ${{ inputs.output-dir }}
        GOP_HAS_BASELINE: ${{ steps.baseline.outputs.found }}
      run: |
        set -euo pipefail
        # With a downloaded baseline the report opens with what changed since
        # it. A baseline gop cannot compare (another enterprise or schema)
        # still gives the full report, without the banner.
        prev="${RUNNER_TEMP}/gop-baseline/graph.json"
        if [ "${GOP_HAS_BASELINE}" = "true" ] && [ -f "${prev}" ]; then
          if gop report --graph "${GOP_OUT}/graph.json" --previous "${prev}" --out "${GOP_OUT}/report.html"; then
            exit 0
          fi
          echo "gop action: cannot compare with the baseline; writing the report without the what-changed banner"
        fi
        gop report --graph "${GOP_OUT}/graph.json" --out "${GOP_OUT}/report.html"

    - name: Summarize for gop Cloud
      if: inputs.cloud == 'true'
      shell: bash
      env:
        GOP_OUT: ${{ inputs.output-dir }}
      run: gop summary --graph "${GOP_OUT}/graph.json" --out "${GOP_OUT}/summary.json"

    - name: Upload graph and report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gop-posture
        path: |
          ${{ inputs.output-dir }}/graph.json
          ${{ inputs.output-dir }}/report.html
          ${{ inputs.output-dir }}/diff.md
          ${{ inputs.output-dir }}/diff.json
          ${{ inputs.output-dir }}/diff-stderr.txt
          ${{ inputs.output-dir }}/summary.json
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - name: Upload summary to gop Cloud
      if: inputs.cloud == 'true'
      shell: bash
      env:
        GOP_OUT: ${{ inputs.output-dir }}
        GOP_CLOUD_URL: ${{ inputs.cloud-url }}
        GOP_CLOUD: ${{ github.action_path }}/cloud-upload.sh
      # Sends summary.json only, with a GitHub OIDC token (audience
      # gop-cloud) that is masked and never printed. Runs after the artifact
      # upload so a failed upload never loses the scan.
      run: bash "${GOP_CLOUD}" upload "${GOP_OUT}/summary.json" "${GOP_CLOUD_URL}"

    - name: Fail on reach increase
      if: steps.gate.outputs.result == 'increase' || steps.gate.outputs.result == 'error'
      shell: bash
      env:
        GOP_RESULT: ${{ steps.gate.outputs.result }}
      run: |
        # One line only: the step summary is visible to repo readers, so it
        # never names nodes. The diff is in the artifact.
        if [ "${GOP_RESULT}" = "increase" ]; then
          echo "confirmed reach increased; see artifact" >> "${GITHUB_STEP_SUMMARY}"
          echo "gop action: confirmed reach increased; see artifact"
        else
          echo "gop action: gop diff failed; see artifact"
        fi
        exit 1
