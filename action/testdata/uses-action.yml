# Not a workflow GitHub runs: it lives outside .github/workflows. CI runs
# actionlint on it so actionlint loads ../action.yml and checks the inputs
# every supported token mode passes.
name: gop action lint fixture
on: workflow_dispatch
permissions:
  contents: read
jobs:
  app-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: ./action
        with:
          enterprise: acme
          app-id: ${{ vars.GOP_APP_ID }}
          app-private-key: ${{ secrets.GOP_APP_PRIVATE_KEY }}
          retention-days: 1
  token-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: ./action
        with:
          enterprise: acme
          token: ${{ secrets.GOP_TOKEN }}
  reach-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: ./action
        with:
          enterprise: acme
          app-id: ${{ vars.GOP_APP_ID }}
          app-private-key: ${{ secrets.GOP_APP_PRIVATE_KEY }}
          fail-on-reach-increase: "true"
          baseline-artifact: gop-posture
          retention-days: 7
  windows:
    runs-on: windows-latest
    steps:
      - uses: ./action
        with:
          enterprise: acme
          app-id: ${{ vars.GOP_APP_ID }}
          app-private-key: ${{ secrets.GOP_APP_PRIVATE_KEY }}
          retention-days: 1
  cloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ./action
        with:
          enterprise: acme
          app-id: ${{ vars.GOP_APP_ID }}
          app-private-key: ${{ secrets.GOP_APP_PRIVATE_KEY }}
          cloud: "true"
          cloud-url: https://cloud.example.com/v1/ingest
