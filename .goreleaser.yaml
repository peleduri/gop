# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gop

before:
  hooks:
    - go mod tidy
    - go test ./... -count=1

builds:
  - id: gop
    main: ./cmd/gop
    binary: gop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: gop
    ids: [gop]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive-sbom
    artifacts: archive

# Keyless signing: cosign gets a short-lived certificate from Sigstore using the
# release workflow's GitHub OIDC token. Each signed file gets a
# <file>.sigstore.json bundle (signature + certificate + transparency log entry).
signs:
  - id: cosign-keyless
    cmd: cosign
    artifacts: all # checksums.txt, archives and SBOMs
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: peleduri
    name: gop
  prerelease: auto

# Homebrew tap: `brew install peleduri/tap/gop`.
# goreleaser pushes the cask to peleduri/homebrew-tap with the
# HOMEBREW_TAP_TOKEN secret, which only the goreleaser step of
# .github/workflows/release.yml receives. Without that variable (snapshot
# builds, forks, or before the one-time setup in docs/maintainers.md) the cask
# is still generated in dist/ but never uploaded.
homebrew_casks:
  - name: gop
    binaries: [gop]
    repository:
      owner: peleduri
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    commit_author:
      name: gop-release
      email: gop-release@users.noreply.github.com
    commit_msg_template: "gop {{ .Tag }}"
    homepage: https://github.com/peleduri/gop
    description: Read-only evidence graph of who can make code run where in a GitHub Enterprise.
    license: Apache-2.0
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        # The binaries are signed with cosign, not with an Apple developer ID,
        # so clear the quarantine flag that would make macOS refuse to run gop.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gop"]
          end
