# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gop

before:
  hooks:
    - go mod tidy
    - go test ./... -count=1

builds:
  - id: gop
    main: ./cmd/gop
    binary: gop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # One Claude Desktop extension (.mcpb) per target: manifest.json plus this
    # binary, written to dist/mcpb/gop_<version>_<os>_<arch>.mcpb by
    # scripts/dist. They are added to checksums.txt (so covered by its cosign
    # signature) and uploaded with the release (extra_files below). Snapshot
    # builds write them too. See docs/maintainers.md.
    hooks:
      post:
        - cmd: go run ./scripts/dist mcpb --binary "{{ .Path }}" --os {{ .Os }} --arch {{ .Arch }} --version {{ .Version }} --out dist/mcpb
          output: true
  # The same program built as gh-gop, for the GitHub CLI extension
  # (`gh extension install peleduri/gh-gop`, then `gh gop ...`). gh installs a
  # precompiled extension by picking the release asset whose name ends in
  # <os>-<arch> (plus .exe on Windows), so these ship as bare binaries named
  # gh-gop-<os>-<arch>[.exe] (archive gh-gop below). The gop binary and its
  # archives are unchanged. See docs/maintainers.md for the gh-gop repository.
  - id: gh-gop
    main: ./cmd/gop
    binary: gh-gop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: gop
    ids: [gop]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
  - id: gh-gop
    ids: [gh-gop]
    formats: [binary]
    name_template: "gh-gop-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./dist/mcpb/*.mcpb

sboms:
  - id: archive-sbom
    artifacts: archive

# Keyless signing: cosign gets a short-lived certificate from Sigstore using the
# release workflow's GitHub OIDC token. Each signed file gets a
# <file>.sigstore.json bundle (signature + certificate + transparency log entry).
signs:
  - id: cosign-keyless
    cmd: cosign
    artifacts: all # checksums.txt, archives and SBOMs
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# Container image: ghcr.io/peleduri/gop:<version> (and :latest for stable
# releases) for linux/amd64 and linux/arm64, from the distroless nonroot base
# pinned in Dockerfile. buildx builds and pushes the multi-arch index in the
# publish phase; release.yml then signs it keyless by digest with cosign and
# attaches a signed SPDX SBOM and SLSA provenance. A snapshot build loads one
# image per platform locally instead (tags <version>-amd64 and -arm64) and
# pushes nothing. sbom is off here because the buildx SBOM attestation is
# unsigned and cannot be loaded into a local daemon; release.yml attaches a
# signed one instead.
dockers_v2:
  - id: gop
    ids: [gop]
    dockerfile: Dockerfile
    images:
      - ghcr.io/peleduri/gop
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: "false"
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Read-only evidence graph of who can make code run where in a GitHub Enterprise."
      "org.opencontainers.image.source": "https://github.com/peleduri/gop"
      "org.opencontainers.image.url": "https://github.com/peleduri/gop"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .CommitDate }}"
      "org.opencontainers.image.licenses": "Apache-2.0"
      # The official MCP Registry checks that this label equals the name in
      # server.json before it lists the image (ownership proof).
      "io.modelcontextprotocol.server.name": "io.github.peleduri/gop"
    annotations:
      # Shown on the GHCR package page, which reads the index. Empty (so
      # dropped) in snapshot builds, which load single-platform images where
      # an index annotation is not allowed.
      "index:org.opencontainers.image.description": '{{ if not .IsSnapshot }}Read-only evidence graph of who can make code run where in a GitHub Enterprise.{{ end }}'

# Release notes for tag releases. `use: github` reads the commits between the
# two tags through the GitHub API (with the release job's GITHUB_TOKEN) and
# links each one to its author. Commits are grouped by conventional commit
# prefix, which the PR title lint (.github/workflows/pr-title.yml) enforces on
# squash-merged PR titles. .github/release.yml groups GitHub's own generated
# notes by label.
changelog:
  use: github
  sort: asc
  groups:
    - title: Security
      regexp: '^.*?sec(\([[:word:]-]+\))??!?:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]-]+\))??!?:.+$'
      order: 1
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]-]+\))??!?:.+$'
      order: 2
    - title: Docs
      regexp: '^.*?docs(\([[:word:]-]+\))??!?:.+$'
      order: 3
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"

release:
  github:
    owner: peleduri
    name: gop
  prerelease: auto
  # The Claude Desktop extensions built by the gop build hook.
  extra_files:
    - glob: ./dist/mcpb/*.mcpb

# Homebrew tap: `brew install peleduri/tap/gop`.
# goreleaser pushes the cask to peleduri/homebrew-tap with the
# HOMEBREW_TAP_TOKEN secret, which only the goreleaser step of
# .github/workflows/release.yml receives. Without that variable (snapshot
# builds, forks, or before the one-time setup in docs/maintainers.md) the cask
# is still generated in dist/ but never uploaded.
homebrew_casks:
  - name: gop
    ids: [gop]
    binaries: [gop]
    repository:
      owner: peleduri
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    commit_author:
      name: gop-release
      email: gop-release@users.noreply.github.com
    commit_msg_template: "gop {{ .Tag }}"
    homepage: https://github.com/peleduri/gop
    description: Read-only evidence graph of who can make code run where in a GitHub Enterprise.
    license: Apache-2.0
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        # The binaries are signed with cosign, not with an Apple developer ID,
        # so clear the quarantine flag that would make macOS refuse to run gop.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gop"]
          end
