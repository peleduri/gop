# Synthetic fixture: the Codex CLI reviews pull requests from forks on
# pull_request_target, with the pull request title in its prompt.
name: Codex review
on: pull_request_target
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @openai/codex
      - run: |
          codex exec --full-auto "Review this pull request: ${{ github.event.pull_request.title }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
