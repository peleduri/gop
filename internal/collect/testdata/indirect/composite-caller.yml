# Synthetic fixture: the agent hides in a local composite action that a
# pull_request_target job loads after checking out the pull request's head.
name: Review
on: pull_request_target
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - uses: ./.github/actions/ai-review
        with:
          dir: pr
          title: ${{ github.event.pull_request.title }}
