# Synthetic fixture: a pull_request_target step runs a repo script with a
# model API key; the script runs an agent CLI on the pull request's diff.
name: Summarize
on: pull_request_target
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/ai-summary.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
