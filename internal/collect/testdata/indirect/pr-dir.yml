# Synthetic fixture: a known agent reads a checkout of the pull request's
# head in pr/ (its prompt names the path); no step runs code from it.
name: Agent review
on: pull_request_target
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - uses: anthropics/claude-code-base-action@v1
        with:
          prompt: Review the files under pr/ and comment on the pull request.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
