name: Feature request
description: Suggest a new fact, path type, AI agent, MCP tool or report section
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public: describe your setup with synthetic names (`acme-actions`, `alice`), never real org, repo or user names.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which "who can make code run where" question can't you answer today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Which API would supply the fact, and what evidence level (live, audit, not_visible) it would carry.
  - type: textarea
    id: permissions
    attributes:
      label: Extra permissions needed
      description: gop is read-only. Note any new scope this would require.
