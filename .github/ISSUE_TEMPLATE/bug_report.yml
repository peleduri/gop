name: Bug report
description: Something gop reports or does is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach or paste a raw graph.json: it is a map of who can run code where in your enterprise. Attach the output of `gop redact --graph graph.json --out shareable.json` instead, which renames every org, repo, user and secret and checks that no original name is left. Do not paste org names, repo names or tokens.
        Security vulnerabilities go through private vulnerability reporting (Security tab), not issues.
  - type: input
    id: version
    attributes:
      label: gop version
      description: Output of `gop version`
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [gop collect, gop serve (MCP), gop report, GitHub Action, other]
    validations:
      required: true
  - type: dropdown
    id: token
    attributes:
      label: Token type
      options: [GitHub App installation token, fine-grained PAT, classic PAT, other]
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Include whether the fact was reported as live, audit or not_visible.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (synthetic data only)
  - type: textarea
    id: graph
    attributes:
      label: Redacted graph (optional)
      description: |
        If the problem depends on your graph, run `gop redact --graph graph.json --out shareable.json` and attach shareable.json (drag the file here). Never a raw graph.json, and never the `--map-out` mapping file. Say which synthetic node IDs show the problem, e.g. `repo:acme-org-03/repo-012`.
