# Categories for GitHub's generated release notes ("Generate release notes" on
# a release, or the API). A PR goes into the first category whose labels it
# has, so Security comes first: a security fix labeled both feature and
# security is listed under Security. Labels are described in labels.yml.
# Tag releases built by goreleaser group by conventional commit prefix instead
# (changelog in .goreleaser.yaml); both read the same PR titles and labels.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - correctness
    - title: Docs
      labels:
        - docs
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
