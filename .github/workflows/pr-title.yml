name: pr-title

# Checks that the PR title is a conventional commit ("feat(collect): ...").
# PRs are squash-merged with the title as the commit message, and goreleaser
# groups release notes by that prefix (.goreleaser.yaml changelog).
#
# Runs on pull_request, never pull_request_target: a PR from a fork gets a
# read-only token and no secrets. The token can only read pull requests.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the groups in .goreleaser.yaml and the list in
          # CONTRIBUTING.md.
          types: |
            feat
            fix
            sec
            docs
            perf
            refactor
            test
            ci
            build
            chore
            revert
            release
