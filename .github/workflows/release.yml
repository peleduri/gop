name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signing and build provenance
      attestations: write # store the SLSA provenance attestation
      packages: write # push the container image, its signature and attestations to GHCR
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # goreleaser builds the changelog from history
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask to peleduri/homebrew-tap. Only this step
          # gets it; when the secret is unset the cask upload is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/mcpb/*.mcpb
            dist/checksums.txt
      - name: image digest
        id: image
        # The digest of the multi-arch index goreleaser pushed. Everything below
        # signs and attests this digest, never a tag.
        run: |
          digest=$(jq -r '
            [.[] | select(.type == "Docker Image" and (.name | startswith("ghcr.io/peleduri/gop:"))) | .extra.Digest]
            | unique
            | if length == 1 then .[0] else error("expected one image digest, got \(length)") end
          ' dist/artifacts.json)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "unexpected image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: sign image and attest SBOM
        # Same keyless identity as checksums.txt: this workflow at this tag.
        env:
          IMAGE: ghcr.io/peleduri/gop
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          syft scan "registry:${IMAGE}@${DIGEST}" -o "spdx-json=dist/image.sbom.spdx.json"
          cosign attest --yes --type spdxjson --predicate dist/image.sbom.spdx.json "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/peleduri/gop
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # Publishes server.json to the official MCP Registry
  # (registry.modelcontextprotocol.io) as io.github.peleduri/gop, with the
  # GHCR image and the release's .mcpb bundles. Login is GitHub OIDC: the
  # registry checks this workflow's id token, so no secret is stored. Stable
  # tags only, after the image and assets exist (the registry checks the image
  # label). See docs/maintainers.md.
  mcp-registry:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out server.json, download the release checksums
      id-token: write # mcp-publisher login github-oidc
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
      # sha256 of mcp-publisher_linux_amd64.tar.gz of that release, checked
      # in addition to its Sigstore bundle. Update both together.
      MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: build server.json for this release
        # The committed server.json with this version, plus one mcpb package
        # (URL and sha256) per bundle in the signed checksums.txt.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir rel
          go run ./scripts/dist server-json --version "${TAG#v}" --checksums rel/checksums.txt > server.release.json
          mv server.release.json server.json
          cat server.json
          ./mcp-publisher validate server.json
      - name: publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
