name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1
      - name: engine benchmarks (smoke, one iteration, no thresholds)
        run: go test -run='^$' -bench=. -benchtime=1x ./internal/graph

  fuzz:
    # Short fuzz runs of the parsers that read attacker-controlled input
    # (workflow YAML, composite actions, graph.json). One job per target so
    # they run side by side. Crashers go to testdata/fuzz/ and must be committed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: FuzzParseWorkflow, pkg: ./internal/collect}
          - {target: FuzzParseCompositeAction, pkg: ./internal/collect}
          - {target: FuzzParseUses, pkg: ./internal/collect}
          - {target: FuzzRefKind, pkg: ./internal/collect}
          - {target: FuzzLoad, pkg: ./internal/graph}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          PKG: ${{ matrix.pkg }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=30s "$PKG"

  evals-dry:
    # The deterministic part of the agent-behaviour eval (docs/evals.md): the
    # expected values read from gop for every case, and the checks on the
    # recorded transcripts. No model and no secret; the live eval runs in
    # evals.yml, by hand or weekly.
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check -r evals/requirements-dry.txt
      - name: Unit tests
        run: python -m pytest -q evals
      - name: Dry run (recorded transcripts, expected values from gop)
        run: python -m evals.run --dry --out evals/out/dry

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  actionlint:
    # Lints the workflows and the composite Action: actionlint loads
    # action/action.yml through the fixture that uses it and checks its inputs.
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: actionlint
        # Pinned to a released version so the check is reproducible.
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 action/testdata/uses-action.yml

  links:
    # Checks every repo-relative link and Markdown heading anchor in the *.md
    # files. --offline makes no network requests: external URLs are skipped,
    # so the job never flakes on a third-party site.
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress './**/*.md'
          jobSummary: false

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Pinned to a released version so the check is reproducible.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...

  leak-check:
    # The leak check needs the GOP_DENYLIST secret. GitHub does not expose
    # repository secrets to pull requests from forks (or to Dependabot PRs),
    # and scripts/leak-check.sh fails closed without it, so this job is skipped
    # for those PRs. The maintainer runs scripts/leak-check.sh locally against
    # the PR head before merging, and the job runs again on the push to main.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the script also scans commit metadata
      - name: leak check
        env:
          GOP_DENYLIST: ${{ secrets.GOP_DENYLIST }}
          CI: true
        run: ./scripts/leak-check.sh

  release-snapshot:
    # Builds every release target with the real goreleaser config, publishes nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=sign,sbom,publish
      - name: check the snapshot container images
        # The snapshot loads one image per platform, tagged <version>-<arch>.
        # The amd64 one must run gop as 65532:65532 and have no shell.
        run: |
          version=$(jq -r .version dist/metadata.json)
          image="ghcr.io/peleduri/gop:${version}-amd64"
          docker run --rm "$image" version
          user=$(docker image inspect -f '{{.Config.User}}' "$image")
          if [ "$user" != "65532:65532" ]; then
            echo "image user is '$user', want 65532:65532" >&2
            exit 1
          fi
          if docker run --rm --entrypoint sh "$image" -c true; then
            echo "image has a shell" >&2
            exit 1
          fi
          arch=$(docker image inspect -f '{{.Architecture}}' "ghcr.io/peleduri/gop:${version}-arm64")
          if [ "$arch" != "arm64" ]; then
            echo "arm64 image architecture is '$arch'" >&2
            exit 1
          fi
      - name: check the snapshot Claude Desktop extensions
        # One .mcpb per target, each in checksums.txt, and the registry
        # server.json the release job builds from them.
        run: |
          version=$(jq -r .version dist/metadata.json)
          n=$(find dist/mcpb -name "gop_${version}_*.mcpb" | wc -l)
          if [ "$n" -ne 6 ]; then
            echo "want 6 .mcpb bundles, got $n" >&2
            exit 1
          fi
          if [ "$(grep -c '\.mcpb$' dist/checksums.txt)" -ne 6 ]; then
            echo "checksums.txt does not list the 6 bundles" >&2
            exit 1
          fi
          unzip -l "dist/mcpb/gop_${version}_linux_amd64.mcpb" | grep -q ' server/gop$'
          go run ./scripts/dist server-json --version "$version" --checksums dist/checksums.txt | jq -e '[.packages[] | select(.registryType == "mcpb")] | length == 6'
