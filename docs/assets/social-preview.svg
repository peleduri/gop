<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>gop: who can make code run where in your GitHub Enterprise</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5d73"/>
    </marker>
    <marker id="arrHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a33a"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- graph motif, right side -->
  <g stroke-width="3" fill="none">
    <path d="M800 170 L930 250" stroke="#f2a33a" marker-end="url(#arrHot)"/>
    <path d="M960 270 L1080 200" stroke="#f2a33a" marker-end="url(#arrHot)"/>
    <path d="M960 290 L1080 330" stroke="#f2a33a" marker-end="url(#arrHot)"/>
    <path d="M1110 345 L1170 440" stroke="#f2a33a" marker-end="url(#arrHot)"/>
    <path d="M955 290 L958 430" stroke="#4b5d73" marker-end="url(#arr)"/>
    <path d="M790 190 L790 420" stroke="#4b5d73" stroke-dasharray="8 8" marker-end="url(#arr)"/>
    <path d="M1108 205 L1172 245" stroke="#f2a33a" marker-end="url(#arrHot)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#c9d4e0">
    <circle cx="790" cy="160" r="18" fill="#f2a33a"/>
    <text x="790" y="128" text-anchor="middle">members</text>
    <circle cx="950" cy="270" r="16" fill="#e6edf3"/>
    <text x="935" y="300" text-anchor="end">action@main</text>
    <circle cx="1095" cy="195" r="14" fill="#e6edf3"/>
    <text x="1095" y="168" text-anchor="middle">workflow</text>
    <circle cx="1095" cy="335" r="14" fill="#e6edf3"/>
    <text x="1130" y="322">workflow</text>
    <rect x="1176" y="244" width="30" height="30" rx="6" fill="#f2a33a"/>
    <text x="1191" y="296" text-anchor="middle">secret</text>
    <rect x="1162" y="436" width="34" height="34" rx="6" fill="#f2a33a"/>
    <text x="1179" y="500" text-anchor="middle">OIDC</text>
    <circle cx="960" cy="450" r="12" fill="#4b5d73"/>
    <text x="960" y="490" text-anchor="middle">repo CI</text>
    <circle cx="790" cy="440" r="12" fill="none" stroke="#7d8da1" stroke-width="3" stroke-dasharray="4 4"/>
    <text x="790" y="480" text-anchor="middle" fill="#7d8da1">not_visible</text>
  </g>

  <!-- text, left side -->
  <text x="88" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="168" font-weight="700" fill="#e6edf3">gop</text>
  <text x="92" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#c9d4e0">who can make code run where</text>
  <text x="92" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#c9d4e0">in your GitHub Enterprise</text>
  <text x="92" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#7d8da1">read-only  ·  evidence graph  ·  CLI + MCP server</text>
  <text x="92" y="556" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#7d8da1">github.com/peleduri/gop</text>
</svg>
